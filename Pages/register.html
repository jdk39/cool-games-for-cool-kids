<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account - Cool Games for Cool Kids</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="auth-page" style="background: radial-gradient(circle at 80% 15%, #123832 0%, var(--bg) 55%);">
  <div class="auth-card">

    <div class="auth-header">
      <span class="logo">Cool Games <span>for</span> Cool Kids</span>
      <h1>Create your account</h1>
      <p>Join and get games picked just for you.</p>
    </div>

    <form class="auth-form" action="#" method="post">

      <div class="field">
        <label for="reg-username">Username</label>
        <input id="reg-username" name="username" type="text" placeholder="PixelJordan" required>
      </div>

      <div class="field">
        <label for="reg-email">Email</label>
        <input id="reg-email" name="email" type="email" placeholder="you@example.com" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="reg-password">Password</label>
          <input id="reg-password" name="password" type="password" placeholder="••••••••" required>
        </div>
        <div class="field">
          <label for="reg-password-confirm">Confirm</label>
          <input id="reg-password-confirm" name="password_confirm" type="password" placeholder="••••••••" required>
        </div>
      </div>

      <label class="terms-label">
        <input type="checkbox" name="terms" required>
        I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
      </label>

      <button type="submit" class="btn-accent2">Create Account</button>

    </form>

    <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>

  </div>
</main>

</body>
</html>
