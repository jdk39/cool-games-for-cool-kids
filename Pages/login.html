<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In - Cool Games for Cool Kids</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="auth-page" style="background: radial-gradient(circle at 20% 20%, #1b1440 0%, var(--bg) 55%);">
  <div class="auth-card">

    <div class="auth-header">
      <span class="logo">Cool Games <span>for</span> Cool Kids</span>
      <h1>Welcome back</h1>
      <p>Log in to keep your win streak going.</p>
    </div>

    <form class="auth-form" action="#" method="post">

      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" placeholder="••••••••" required>
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" name="remember">
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary">Log In</button>

      <div class="divider">
        <div class="line"></div>
        <span>or</span>
        <div class="line"></div>
      </div>

      <button type="button" class="btn-secondary">Continue as Guest</button>

    </form>

    <p class="auth-footer">New here? <a href="register.html">Create an account</a></p>

  </div>
</main>

</body>
</html>
